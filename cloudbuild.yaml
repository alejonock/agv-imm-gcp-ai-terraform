# =============================================================================
# cloudbuild.yaml
#
# PRE-REQUISITO (una sola vez antes de la primera ejecución):
#   gsutil mb -l europe-west1 gs://TU_PROYECTO-tf-state
#   gsutil versioning set on gs://TU_PROYECTO-tf-state
#
# VARIABLES DE SUSTITUCIÓN en el Trigger de Cloud Build:
#   _TF_STATE_BUCKET  → bucket del Terraform state  (ej: "mi-proyecto-tf-state")
#   _BUCKET_NAME      → bucket del código del backend
#   _JIRA_API_KEY     → clave secreta compartida con Jira
#   _REGION           → región GCP (default: europe-west1)
# =============================================================================

substitutions:
  _REGION: "europe-west1"
  _TF_VERSION: "1.7.0"

steps:

  # ---------------------------------------------------------------------------
  # BLOQUE A — Corren en paralelo desde el inicio
  # ---------------------------------------------------------------------------

  # A1: Construye la imagen Docker del proxy OAuth
  - id: "build-proxy-image"
    name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -t
      - "gcr.io/$PROJECT_ID/oauth-proxy:$COMMIT_SHA"
      - -t
      - "gcr.io/$PROJECT_ID/oauth-proxy:latest"
      - ./cloud_run_proxy
    waitFor: ["-"]

  # A2: Crea el bucket del código del backend si no existe
  - id: "ensure-backend-bucket"
    name: "gcr.io/cloud-builders/gsutil"
    entrypoint: "bash"
    args:
      - -c
      - |
        set -e
        BUCKET="gs://$_BUCKET_NAME"
        if gsutil ls "$$BUCKET" > /dev/null 2>&1; then
          echo "✅ Bucket del backend ya existe: $$BUCKET"
        else
          echo "🆕 Creando bucket del backend: $$BUCKET"
          gsutil mb -l $_REGION "$$BUCKET"
          echo "✅ Bucket del backend creado"
        fi
    waitFor: ["-"]

  # A3: Obtiene el access token del SA de Cloud Build
  # ---------------------------------------------------
  # El contenedor de hashicorp/terraform es Alpine Linux y NO tiene
  # acceso automático a las credenciales de GCP. Este paso usa la imagen
  # oficial de Google Cloud SDK (que SÍ tiene acceso nativo a las
  # credenciales de Cloud Build) para obtener el token y guardarlo
  # en /workspace/gcp_token.txt, que es un directorio compartido entre
  # todos los pasos del mismo build.
  - id: "get-gcp-token"
    name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: "bash"
    args:
      - -c
      - |
        set -e
        gcloud auth print-access-token > /workspace/gcp_token.txt
        echo "✅ Access token obtenido y guardado en /workspace/gcp_token.txt"
    waitFor: ["-"]

  # ---------------------------------------------------------------------------
  # BLOQUE B — Dependen del bloque A
  # ---------------------------------------------------------------------------

  # B1: Sube la imagen Docker al Container Registry
  - id: "push-proxy-image"
    name: "gcr.io/cloud-builders/docker"
    args: ["push", "--all-tags", "gcr.io/$PROJECT_ID/oauth-proxy"]
    waitFor: ["build-proxy-image"]

  # B2: Sube el código Python del backend al bucket de GCS
  - id: "upload-backend-code"
    name: "gcr.io/cloud-builders/gsutil"
    args: ["-m", "cp", "-r", "backend_gce/*", "gs://$_BUCKET_NAME/backend_gce/"]
    waitFor: ["ensure-backend-bucket"]

  # ---------------------------------------------------------------------------
  # BLOQUE C — Terraform (espera a que todo el bloque B y el token estén listos)
  #
  # Lee el token de /workspace/gcp_token.txt y lo exporta como
  # GOOGLE_OAUTH_ACCESS_TOKEN para que Terraform (backend GCS + provider
  # google) se autentique con las credenciales del SA de Cloud Build.
  # ---------------------------------------------------------------------------
  - id: "terraform-deploy"
    name: "hashicorp/terraform:$_TF_VERSION"
    dir: "terraform"
    entrypoint: "sh"
    args:
      - -c
      - |
        set -e

        echo "━━━ Cargando credenciales GCP ━━━"
        export GOOGLE_OAUTH_ACCESS_TOKEN=$(cat /workspace/gcp_token.txt)
        echo "✅ Credenciales cargadas"

        echo ""
        echo "━━━ [1/5] Generando terraform.tfvars ━━━"
        cat > terraform.tfvars <<EOF
        project_id        = "$PROJECT_ID"
        region            = "$_REGION"
        state_bucket_name = "$_TF_STATE_BUCKET"
        bucket_name       = "$_BUCKET_NAME"
        jira_api_key      = "$_JIRA_API_KEY"
        cloud_run_image   = "gcr.io/$PROJECT_ID/oauth-proxy:$COMMIT_SHA"
        EOF
        echo "✅ terraform.tfvars generado"

        echo ""
        echo "━━━ [2/5] Terraform Init ━━━"
        terraform init \
          -backend-config="bucket=$_TF_STATE_BUCKET" \
          -input=false
        echo "✅ Init completado"

        echo ""
        echo "━━━ [3/5] Terraform Validate ━━━"
        terraform validate
        echo "✅ Validación correcta"

        echo ""
        echo "━━━ [4/5] Terraform Plan ━━━"
        terraform plan -out=tfplan -input=false

        echo ""
        echo "━━━ [5/5] Terraform Apply ━━━"
        terraform apply -auto-approve -input=false tfplan

        echo ""
        echo "━━━ Outputs de la infraestructura ━━━"
        terraform output
    waitFor: ["push-proxy-image", "upload-backend-code", "get-gcp-token"]

images:
  - "gcr.io/$PROJECT_ID/oauth-proxy:$COMMIT_SHA"
  - "gcr.io/$PROJECT_ID/oauth-proxy:latest"

timeout: "1800s"

options:
  logging: CLOUD_LOGGING_ONLY
