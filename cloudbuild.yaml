# =============================================================================
# cloudbuild.yaml
#
# PRE-REQUISITO (una sola vez antes de la primera ejecución):
#   gsutil mb -l europe-west1 gs://TU_PROYECTO-tf-state
#   gsutil versioning set on gs://TU_PROYECTO-tf-state
#
# VARIABLES DE SUSTITUCIÓN en el Trigger de Cloud Build:
#   _TF_STATE_BUCKET  → bucket del Terraform state  (ej: "mi-proyecto-tf-state")
#   _BUCKET_NAME      → bucket del código del backend
#   _JIRA_API_KEY     → clave secreta compartida con Jira
#   _REGION           → región GCP (default: europe-west1)
# =============================================================================

substitutions:
  _REGION: "europe-west1"
  _TF_VERSION: "1.7.0"

steps:

  # ---------------------------------------------------------------------------
  # BLOQUE A — Corren en paralelo desde el inicio
  # ---------------------------------------------------------------------------

  # A1: Construye la imagen Docker del proxy OAuth
  - id: "build-proxy-image"
    name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -t
      - "gcr.io/$PROJECT_ID/oauth-proxy:$COMMIT_SHA"
      - -t
      - "gcr.io/$PROJECT_ID/oauth-proxy:latest"
      - ./cloud_run_proxy
    waitFor: ["-"]

  # A2: Crea el bucket del código del backend si no existe
  - id: "ensure-backend-bucket"
    name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "bash"
    args:
      - -c
      - |
        set -e
        if gsutil ls gs://$_BUCKET_NAME > /dev/null 2>&1; then
          echo "✅ Bucket del backend ya existe: gs://$_BUCKET_NAME"
        else
          echo "🆕 Creando bucket del backend..."
          gsutil mb -l $_REGION gs://$_BUCKET_NAME
          echo "✅ Bucket del backend creado"
        fi
    waitFor: ["-"]

  # ---------------------------------------------------------------------------
  # BLOQUE B — Dependen del bloque A
  # ---------------------------------------------------------------------------

  # B1: Sube la imagen Docker al Container Registry
  - id: "push-proxy-image"
    name: "gcr.io/cloud-builders/docker"
    args: ["push", "--all-tags", "gcr.io/$PROJECT_ID/oauth-proxy"]
    waitFor: ["build-proxy-image"]

  # B2: Sube el código Python del backend al bucket de GCS
  - id: "upload-backend-code"
    name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "bash"
    args:
      - -c
      - |
        set -e
        gsutil -m cp -r backend_gce/* gs://$_BUCKET_NAME/backend_gce/
        echo "✅ Código del backend subido a gs://$_BUCKET_NAME/backend_gce/"
    waitFor: ["ensure-backend-bucket"]

  # ---------------------------------------------------------------------------
  # BLOQUE C — Terraform completo
  #
  # ¿Por qué usamos gcr.io/cloud-builders/gcloud en vez de hashicorp/terraform?
  #
  # El contenedor de hashicorp/terraform es Alpine Linux y no tiene acceso
  # automático a las credenciales del SA de Cloud Build. En cambio,
  # gcr.io/cloud-builders/gcloud es la imagen oficial de Cloud Build y tiene
  # las credenciales del SA configuradas automáticamente mediante ADC
  # (Application Default Credentials), sin necesidad de pasar tokens ni
  # archivos de clave.
  #
  # Instalamos Terraform dentro de este contenedor al inicio del paso.
  # El tiempo extra es ~15 segundos (descarga puntual en cada build).
  # ---------------------------------------------------------------------------
  - id: "terraform-deploy"
    name: "gcr.io/cloud-builders/gcloud"
    dir: "terraform"
    entrypoint: "bash"
    args:
      - -c
      - |
        set -e

        # ── Instalar Terraform ──────────────────────────────────────────────
        echo "📦 Instalando Terraform $_TF_VERSION..."
        # - Adiciona Unzip ---------
        cat /etc/os-release
        apt-get install -y unzip
        curl -fsSL \
          https://releases.hashicorp.com/terraform/$_TF_VERSION/terraform_${_TF_VERSION}_linux_amd64.zip \
          -o /tmp/terraform.zip
        unzip -q /tmp/terraform.zip -d /tmp/
        mv /tmp/terraform /usr/local/bin/terraform
        terraform version
        echo "✅ Terraform instalado"

        # ── [1/5] Generar terraform.tfvars ─────────────────────────────────
        echo ""
        echo "━━━ [1/5] Generando terraform.tfvars ━━━"
        cat > terraform.tfvars <<EOF
        project_id        = "$PROJECT_ID"
        region            = "$_REGION"
        state_bucket_name = "$_TF_STATE_BUCKET"
        bucket_name       = "$_BUCKET_NAME"
        jira_api_key      = "$_JIRA_API_KEY"
        cloud_run_image   = "gcr.io/$PROJECT_ID/oauth-proxy:$COMMIT_SHA"
        EOF
        echo "✅ terraform.tfvars generado"

        # ── [2/5] Terraform Init ────────────────────────────────────────────
        echo ""
        echo "━━━ [2/5] Terraform Init ━━━"
        terraform init \
          -backend-config="bucket=$_TF_STATE_BUCKET" \
          -input=false
        echo "✅ Init completado"

        # ── [3/5] Terraform Validate ────────────────────────────────────────
        echo ""
        echo "━━━ [3/5] Terraform Validate ━━━"
        terraform validate
        echo "✅ Validación correcta"

        # ── [4/5] Terraform Plan ────────────────────────────────────────────
        echo ""
        echo "━━━ [4/5] Terraform Plan ━━━"
        terraform plan -out=tfplan -input=false

        # ── [5/5] Terraform Apply ───────────────────────────────────────────
        echo ""
        echo "━━━ [5/5] Terraform Apply ━━━"
        terraform apply -auto-approve -input=false tfplan

        # ── Outputs ─────────────────────────────────────────────────────────
        echo ""
        echo "━━━ Outputs de la infraestructura ━━━"
        terraform output
    waitFor: ["push-proxy-image", "upload-backend-code"]

images:
  - "gcr.io/$PROJECT_ID/oauth-proxy:$COMMIT_SHA"
  - "gcr.io/$PROJECT_ID/oauth-proxy:latest"

timeout: "1800s"

options:
  logging: CLOUD_LOGGING_ONLY
