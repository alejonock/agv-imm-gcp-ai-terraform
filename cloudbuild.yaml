substitutions:
  _REGION: "europe-west1"
  _TF_VERSION: "1.7.0"

steps:

  - id: "build-proxy-image"
    name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -t
      - "gcr.io/$PROJECT_ID/oauth-proxy:$COMMIT_SHA"
      - -t
      - "gcr.io/$PROJECT_ID/oauth-proxy:latest"
      - ./cloud_run_proxy
    waitFor: ["-"]

  - id: "ensure-backend-bucket"
    name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "bash"
    args:
      - -c
      - |
        set -e
        if gsutil ls gs://$_BUCKET_NAME > /dev/null 2>&1; then
          echo "✅ Bucket del backend ya existe: gs://$_BUCKET_NAME"
        else
          echo "🆕 Creando bucket del backend..."
          gsutil mb -l $_REGION gs://$_BUCKET_NAME
          echo "✅ Bucket del backend creado"
        fi
    waitFor: ["-"]

  - id: "push-proxy-image"
    name: "gcr.io/cloud-builders/docker"
    args: ["push", "--all-tags", "gcr.io/$PROJECT_ID/oauth-proxy"]
    waitFor: ["build-proxy-image"]

  - id: "upload-backend-code"
    name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "bash"
    args:
      - -c
      - |
        set -e
        gsutil -m cp -r backend_gce/* gs://$_BUCKET_NAME/backend_gce/
        echo "✅ Código del backend subido"
    waitFor: ["ensure-backend-bucket"]

  - id: "terraform-deploy"
    name: "gcr.io/cloud-builders/gcloud"
    dir: "terraform"
    entrypoint: "bash"
    args:
      - -c
      - |
        set -e

        # ── Identidad activa (diagnóstico) ─────────────────────────────────
        echo "=== IDENTIDAD ACTIVA EN CLOUD BUILD ==="
        gcloud auth list
        gcloud config get-value account
        echo "======================================="

        # ── Instalar Terraform ──────────────────────────────────────────────
        echo "📦 Instalando Terraform $_TF_VERSION..."
        curl -fsSL \
          https://releases.hashicorp.com/terraform/$_TF_VERSION/terraform_${_TF_VERSION}_linux_amd64.zip \
          -o /tmp/terraform.zip
        apt-get update
        apt-get install -y unzip -qq
        unzip -q /tmp/terraform.zip -d /tmp/
        mv /tmp/terraform /usr/local/bin/terraform
        echo "✅ Terraform instalado"

        # ── DIAGNÓSTICO: verificar bucket y credenciales ────────────────────
        echo ""
        echo "━━━ DIAGNÓSTICO ━━━"
        echo "PROJECT_ID     : $PROJECT_ID"
        echo "TF_STATE_BUCKET: [$_TF_STATE_BUCKET]"
        echo "Probando acceso al bucket..."
        gsutil ls gs://$_TF_STATE_BUCKET && echo "✅ Bucket accesible" || echo "❌ Bucket NO accesible"
        echo "━━━━━━━━━━━━━━━━━━"

        # ── [1/5] Generar terraform.tfvars ─────────────────────────────────
        echo ""
        echo "━━━ [1/5] Generando terraform.tfvars ━━━"
        cat > terraform.tfvars <<EOF
        project_id        = "$PROJECT_ID"
        region            = "$_REGION"
        state_bucket_name = "$_TF_STATE_BUCKET"
        bucket_name       = "$_BUCKET_NAME"
        jira_api_key      = "$_JIRA_API_KEY"
        cloud_run_image   = "gcr.io/$PROJECT_ID/oauth-proxy:$COMMIT_SHA"
        EOF
        echo "✅ terraform.tfvars generado"

        # ── [2/5] Terraform Init ────────────────────────────────────────────
        # Usamos un archivo backend.hcl en lugar de pasar el bucket
        # por línea de comandos, para evitar problemas de escaping
        echo ""
        echo "━━━ [2/5] Terraform Init ━━━"
        echo "Escribiendo backend.hcl con bucket: $_TF_STATE_BUCKET"
        cat > /tmp/backend.hcl <<EOF
        bucket = "$_TF_STATE_BUCKET"
        prefix = "ia-gcp/state"
        EOF
        cat /tmp/backend.hcl
        terraform init -backend-config=/tmp/backend.hcl -input=false
        echo "✅ Init completado"

        # ── [3/5] Terraform Validate ────────────────────────────────────────
        echo ""
        echo "━━━ [3/5] Terraform Validate ━━━"
        terraform validate
        echo "✅ Validación correcta"

        # ── Import del bucket si ya existe (idempotente) ──────────────────
        # El bucket puede existir del paso ensure-backend-bucket.
        # Si ya está en el state (runs anteriores), el import falla con
        # "already managed" y continuamos igualmente.
        echo ""
        echo "━━━ Importando bucket si no está en el state ━━━"
        terraform import google_storage_bucket.backend_code $_BUCKET_NAME 2>&1           | grep -v "already managed"           || true
        echo "✅ Import completado"

        # ── [4/5] Terraform Plan ────────────────────────────────────────────
        echo ""
        echo "━━━ [4/5] Terraform Plan ━━━"
        terraform plan -out=tfplan -input=false

        # ── [5/5] Terraform Apply ───────────────────────────────────────────
        echo ""
        echo "━━━ [5/5] Terraform Apply ━━━"
        terraform apply -auto-approve -input=false tfplan

        echo ""
        echo "━━━ Outputs ━━━"
        terraform output
    waitFor: ["push-proxy-image", "upload-backend-code"]

images:
  - "gcr.io/$PROJECT_ID/oauth-proxy:$COMMIT_SHA"
  - "gcr.io/$PROJECT_ID/oauth-proxy:latest"

timeout: "1800s"

options:
  logging: CLOUD_LOGGING_ONLY
