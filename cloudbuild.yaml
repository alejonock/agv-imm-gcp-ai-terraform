# =============================================================================
# cloudbuild.yaml
#
# VARIABLES DE SUSTITUCIÓN (configúralas en el Trigger de Cloud Build):
#   _TF_STATE_BUCKET  → bucket para el Terraform state  (ej: "proyecto-tf-state")
#   _BUCKET_NAME      → bucket para el código del backend (ej: "proyecto-ia-backend-src")
#   _JIRA_API_KEY     → clave secreta compartida con Jira
#   _REGION           → región GCP (default: europe-west1)
# =============================================================================

substitutions:
  _REGION: "europe-west1"
  _TF_VERSION: "1.7.0"

steps:

  # ---------------------------------------------------------------------------
  # BLOQUE A — Los tres corren en paralelo desde el inicio
  # ---------------------------------------------------------------------------

  # A1: Construye la imagen Docker del proxy OAuth
  - id: "build-proxy-image"
    name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -t
      - "gcr.io/$PROJECT_ID/oauth-proxy:$COMMIT_SHA"
      - -t
      - "gcr.io/$PROJECT_ID/oauth-proxy:latest"
      - ./cloud_run_proxy
    waitFor: ["-"]

  # A2: Crea el bucket del Terraform state si no existe
  - id: "ensure-state-bucket"
    name: "gcr.io/cloud-builders/gsutil"
    entrypoint: "bash"
    args:
      - -c
      - |
        set -e
        BUCKET="gs://$_TF_STATE_BUCKET"
        if gsutil ls "$$BUCKET" > /dev/null 2>&1; then
          echo "✅ Bucket del state ya existe: $$BUCKET"
        else
          echo "🆕 Creando bucket del state: $$BUCKET"
          gsutil mb -l $_REGION "$$BUCKET"
          gsutil versioning set on "$$BUCKET"
          echo "✅ Bucket del state creado con versionado activado"
        fi
    waitFor: ["-"]

  # A3: Crea el bucket del código del backend si no existe
  - id: "ensure-backend-bucket"
    name: "gcr.io/cloud-builders/gsutil"
    entrypoint: "bash"
    args:
      - -c
      - |
        set -e
        BUCKET="gs://$_BUCKET_NAME"
        if gsutil ls "$$BUCKET" > /dev/null 2>&1; then
          echo "✅ Bucket del backend ya existe: $$BUCKET"
        else
          echo "🆕 Creando bucket del backend: $$BUCKET"
          gsutil mb -l $_REGION "$$BUCKET"
          echo "✅ Bucket del backend creado"
        fi
    waitFor: ["-"]

  # ---------------------------------------------------------------------------
  # BLOQUE B — Dependen del bloque A
  # ---------------------------------------------------------------------------

  # B1: Sube la imagen Docker (espera al build)
  - id: "push-proxy-image"
    name: "gcr.io/cloud-builders/docker"
    args: ["push", "--all-tags", "gcr.io/$PROJECT_ID/oauth-proxy"]
    waitFor: ["build-proxy-image"]

  # B2: Sube el código Python del backend (espera a que el bucket exista)
  - id: "upload-backend-code"
    name: "gcr.io/cloud-builders/gsutil"
    args: ["-m", "cp", "-r", "backend_gce/*", "gs://$_BUCKET_NAME/backend_gce/"]
    waitFor: ["ensure-backend-bucket"]

  # ---------------------------------------------------------------------------
  # BLOQUE C — Terraform completo en un solo paso
  #
  # ¿Por qué un solo paso?
  #   Cada paso de Cloud Build corre en un contenedor aislado. Terraform
  #   descarga los providers durante "init" al directorio .terraform/.
  #   Si init y validate corren en contenedores distintos, el segundo
  #   contenedor arranca sin los providers ya descargados y falla.
  #   Al correr todo en un mismo paso con "set -e", cualquier error
  #   detiene la ejecución inmediatamente y los providers siempre están
  #   disponibles para los comandos siguientes.
  # ---------------------------------------------------------------------------
  - id: "terraform-deploy"
    name: "hashicorp/terraform:$_TF_VERSION"
    dir: "terraform"
    entrypoint: "sh"
    args:
      - -c
      - |
        set -e   # Detiene el script inmediatamente si cualquier comando falla

        echo "━━━ [1/5] Generando terraform.tfvars ━━━"
        cat > terraform.tfvars <<EOF
        project_id        = "$PROJECT_ID"
        region            = "$_REGION"
        state_bucket_name = "$_TF_STATE_BUCKET"
        bucket_name       = "$_BUCKET_NAME"
        jira_api_key      = "$_JIRA_API_KEY"
        cloud_run_image   = "gcr.io/$PROJECT_ID/oauth-proxy:$COMMIT_SHA"
        EOF
        echo "✅ terraform.tfvars generado"

        echo ""
        echo "━━━ [2/5] Terraform Init (descarga providers + conecta al state) ━━━"
        terraform init \
          -backend-config="bucket=$_TF_STATE_BUCKET" \
          -input=false
        echo "✅ Init completado"

        echo ""
        echo "━━━ [3/5] Terraform Validate ━━━"
        terraform validate
        echo "✅ Validación correcta"

        echo ""
        echo "━━━ [4/5] Terraform Plan ━━━"
        terraform plan -out=tfplan -input=false

        echo ""
        echo "━━━ [5/5] Terraform Apply ━━━"
        terraform apply -auto-approve -input=false tfplan

        echo ""
        echo "━━━ Outputs de la infraestructura ━━━"
        terraform output
    waitFor: ["push-proxy-image", "upload-backend-code", "ensure-state-bucket"]

images:
  - "gcr.io/$PROJECT_ID/oauth-proxy:$COMMIT_SHA"
  - "gcr.io/$PROJECT_ID/oauth-proxy:latest"

timeout: "1800s"

options:
  logging: CLOUD_LOGGING_ONLY
